name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install contributor tooling
        run: |
          npm ci
          python -m pip install -r requirements-dev.txt

      - name: Validate JSON manifests
        run: |
          for f in .claude-plugin/plugin.json .claude-plugin/marketplace.json \
                   .codex-plugin/plugin.json .agents/plugins/marketplace.json \
                   .github/plugin/plugin.json hooks/hooks.json hooks/codex-hooks.json \
                   hooks/copilot-hooks.json config/defaults.json scripts/fixtures/review_quality.json \
                   skills/review-code/categories.json; do
            python3 -c "import json; json.load(open('$f')); print('$f OK')"
          done

      - name: Check hook script syntax
        run: |
          for f in conftest.py tests/*.py hooks/scripts/*.py hooks/rules/*.py scripts/*.py; do
            python3 -m py_compile "$f" || exit 1
            echo "$f OK"
          done

      - name: Check JS hook script syntax
        run: |
          for f in hooks/*.mjs hooks/scripts/*.js scripts/*.js; do
            [ -f "$f" ] || continue
            node --check "$f" || exit 1
            echo "$f OK"
          done

      - name: Run Python tests in parallel
        run: python -m pytest -n auto

      - name: Run native Claude settings pane tests
        run: npm run test:settings-ui

      - name: Run worktree self-test
        run: node scripts/create-worktree.js --self-test

      - name: Run native workflow self-check
        run: node scripts/development_workflow_self_check.js

      - name: Check release changelog
        run: npm run release:check

      - name: Check skill frontmatter
        run: |
          for f in skills/*/SKILL.md; do
            head -1 "$f" | grep -q '^---$' || { echo "missing frontmatter: $f"; exit 1; }
            grep -q '^name:' "$f" || { echo "missing name: $f"; exit 1; }
            grep -q '^description:' "$f" || { echo "missing description: $f"; exit 1; }
            echo "$f OK"
          done

      - name: Check for literal em-dash
        run: |
          python3 -c "
          import pathlib, sys
          em_dash = chr(0x2014)
          hits = []
          for pattern in ('**/*.py', '**/*.md', '**/*.json', '**/*.js', '**/*.mjs', '**/*.ts'):
              for path in pathlib.Path('.').glob(pattern):
                  if any(part in {'.git', 'node_modules', '.venv', '.pytest_cache'} for part in path.parts):
                      continue
                  text = path.read_text(errors='ignore')
                  if em_dash in text:
                      hits.append(str(path))
          if hits:
              print('Literal em-dash found in:', *hits, sep='\n  ')
              sys.exit(1)
          print('No em-dash found')
          "

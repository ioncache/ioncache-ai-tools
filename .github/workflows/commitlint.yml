name: Commit conventions

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

env:
  HUSKY: '0'

jobs:
  commitlint:
    name: Commit conventions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Check PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npx --no -- commitlint --verbose

      - name: Check PR commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx --no -- commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

      - name: Check pushed commits
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          if git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            npx --no -- commitlint --from "$BEFORE_SHA" --to "$AFTER_SHA" --verbose
          else
            npx --no -- commitlint --to "$AFTER_SHA" --verbose
          fi
